[workspace]
resolver = "2"
members = [
    "crates/pipeline-core",
    "crates/me-project",
    "crates/model-manager",
    "crates/me-polish",
    "crates/me-render",
    "crates/me-detect",
    "crates/me-ocr",
    "crates/me-inpaint",
    "crates/me-translate",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Maicarons/manga-eroico"
authors = ["Mai <Maicarons>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
sysinfo = "0.33"
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
