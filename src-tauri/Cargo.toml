[package]
name = "manga-eroico"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "manga-eroico desktop app (Tauri 2 host)"

[lib]
name = "manga_eroico_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
reqwest = { workspace = true }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

pipeline-core = { path = "../crates/pipeline-core" }
me-project = { path = "../crates/me-project" }
model-manager = { path = "../crates/model-manager" }
me-polish = { path = "../crates/me-polish" }
me-detect = { path = "../crates/me-detect" }
me-ocr = { path = "../crates/me-ocr" }
me-inpaint = { path = "../crates/me-inpaint" }
me-translate = { path = "../crates/me-translate" }
me-render = { path = "../crates/me-render" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["rt", "macros"] }
